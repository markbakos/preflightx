[package]
name = "preflightx"
version = "0.1.0"
edition = "2024"
description = "Pre-execution security scanner for untrusted source repositories"
publish = false

[dependencies]
base64 = "0.23.1"
infer = "0.22.0"
flate2 = "1"
gix = { version = "0.87", default-features = false, features = ["basic", "sha1", "sha256", "revision"] }
json5 = "1.3.1"
oxc_allocator = "0.151.0"
oxc_ast = "0.151.0"
oxc_ast_visit = "0.151.0"
oxc_parser = "0.151.0"
oxc_semantic = "0.151.0"
oxc_span = "0.151.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
yara-x = { version = "1.20", default-features = false, features = ["constant-folding"] }
zip = { version = "8.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
