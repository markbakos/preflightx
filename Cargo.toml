[package]
name = "preflightx"
version = "0.1.0"
edition = "2024"
description = "Pre-execution security scanner for untrusted source repositories"
publish = false

[dependencies]
infer = "0.22.0"
json5 = "1.3.1"
oxc_allocator = "0.151.0"
oxc_parser = "0.151.0"
oxc_span = "0.151.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
